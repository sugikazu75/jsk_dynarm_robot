servo_controller:

  joints:
    # for low pass filter
    filter_flag: true
    sample_freq: 50.0 # 50Hz
    cutoff_freq: 10.0 # 10Hz, test

    # for simulation
    simulation:
      pid: {p: 20.0, i: 0.0, d: 0.5}
      init_value: 0.0
      type: effort_controllers/JointComputeTorqueController

    controller1:
      name: joint1
      simulation:
        init_value: 1.0
    controller2:
      name: joint2
      simulation:
        init_value: -1.0
    controller3:
      name: joint3

  gimbals:
    simulation:
      pid: {p: 5.0, i: 0.0, d: 1.0}
      init_value: 0.0
      type: effort_controllers/JointPositionController

    controller1:
      name: gimbal1_roll
    controller2:
      name: gimbal1_pitch
    controller3:
      name: gimbal2_roll
    controller4:
      name: gimbal2_pitch
