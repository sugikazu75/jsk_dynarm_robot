servo_controller:

  joints:
    # for low pass filter
    filter_flag: true
    sample_freq: 50.0 # 50Hz
    cutoff_freq: 10.0 # 10Hz, test

    # for simulation
    simulation:
      pid: {p: 200.0, i: 0.0, d: 10.0}
      init_value: 0.0
      type: effort_controllers/JointComputeTorqueController

    controller1:
      name: joint0_roll
    controller2:
      name: joint0_pitch
      simulation:
        init_value: 0.5
    controller3:
      name: joint1_yaw
    controller4:
      name: joint1_pitch
      simulation:
        init_value: -1.0
    controller5:
      name: joint2_yaw
    controller6:
      name: joint2_pitch
      simulation:
        init_value: -0.5

  gimbals:
    simulation:
      pid: {p: 50.0, i: 0.01, d: 0.0}
      init_value: 0.0
      type: effort_controllers/JointPositionController

    controller1:
      name: gimbal1_roll
    controller2:
      name: gimbal1_pitch
    controller3:
      name: gimbal2_roll
    controller4:
      name: gimbal2_pitch
    controller5:
      name: gimbal3_roll
    controller6:
      name: gimbal3_pitch
